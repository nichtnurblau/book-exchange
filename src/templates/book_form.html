{% extends "base.html" %}{% block content %}<h1>{{ 'Изменить книгу' if book else 'Добавить книгу' }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}<form class="panel narrow" method="post" action="/books/save">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="book_id" value="{{ book.id if book else 0 }}">
<label>Название<input name="title" required maxlength="150" value="{{ book.title if book else '' }}"></label>
<label>Автор<input name="author" required maxlength="150" value="{{ book.author if book else '' }}"></label>
<label>Жанр<select name="genre">{% for genre in genres %}<option {% if book and book.genre == genre %}selected{% endif %}>{{ genre }}</option>{% endfor %}</select></label>
<label>Состояние<select name="condition">{% for item in conditions %}<option {% if book and book.condition == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
<label>Описание<textarea name="description" maxlength="1000">{{ book.description if book else '' }}</textarea></label><button>Сохранить</button></form>{% endblock %}
