<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Книгообмен{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><a class="brand" href="/">Книгообмен</a><nav><a href="/">Каталог</a>
{% if user %}<a href="/books">Мои книги</a><a href="/exchanges">Мои заявки</a>
<span>{{ user.name }}</span><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Выйти</button></form>
{% else %}<a href="/login">Войти</a><a href="/register">Регистрация</a>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main><footer>Обмен бумажными книгами между читателями</footer></body></html>
