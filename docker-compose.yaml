services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookexchange}
      POSTGRES_USER: ${POSTGRES_USER:-bookexchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookexchange}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 5s
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookexchange}
      POSTGRES_USER: ${POSTGRES_USER:-bookexchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookexchange}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/catalog', timeout=3)"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:

