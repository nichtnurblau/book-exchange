name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://bookexchange:bookexchange@localhost:5432/bookexchange
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Start PostgreSQL through Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait
      - run: uv run --env-file .env alembic upgrade head
      - run: uv run --env-file .env alembic check
      - run: uv run --env-file .env python -m unittest discover -s tests -v
      - name: Check console startup
        run: printf '0\n' | uv run --env-file .env python -m src.main
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down
